<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng hợp các Ví dụ Flexbox Tailwind CSS</title>
    <link rel="stylesheet" href="src/output.css">
    <style>
        /* CSS tùy chỉnh cho các phần tử con */
        .child-basic {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem; /* text-2xl */
            font-weight: bold;
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
            margin: 8px; /* Khoảng cách giữa các item */
        }

        /* Chiều cao ngẫu nhiên cho ví dụ align-items */
        .child-align {
            width: 70px;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            text-align: center;
            border-radius: 6px;
            margin: 0 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .child-align:nth-child(1) { background-color: #ef4444; height: 80px;}
        .child-align:nth-child(2) { background-color: #f97316; height: 112px;}
        .child-align:nth-child(3) { background-color: #eab308; height: 64px;}
        .child-align:nth-child(4) { background-color: #22c55e; height: 144px;}
        .child-align:nth-child(5) { background-color: #0ea5e9; height: 96px;}
    

    </style>
</head>
<body class="p-8 bg-gray-100 font-sans">

    <h1 class="text-4xl font-extrabold mb-12 text-center text-indigo-800">
        🚀 Tổng hợp các Lớp Flexbox cơ bản của Tailwind CSS
    </h1>

    <div class="mb-16 bg-white p-6 rounded-xl shadow-2xl">
        <h2 class="text-3xl font-bold mb-6 text-blue-700">1. `flex-direction` (Hướng đi của Item)</h2>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <div class="p-4 border-4 border-indigo-400 bg-indigo-50 rounded-lg">
                <h4 class="text-xl font-bold mb-3 text-indigo-700">`flex-row` (Hàng ngang)</h4>
                <div class="flex flex-row items-center border-dashed border-indigo-300 p-2">
                    <div class="child-basic bg-indigo-600">1</div>
                    <div class="child-basic bg-indigo-600">2</div>
                    <div class="child-basic bg-indigo-600">3</div>
                    <div class="child-basic bg-indigo-600">4</div>
                </div>
            </div>

            <div class="p-4 border-4 border-red-400 bg-red-50 rounded-lg">
                <h4 class="text-xl font-bold mb-3 text-red-700">`flex-row-reverse` (Hàng ngang đảo ngược)</h4>
                <div class="flex flex-row-reverse items-center border-dashed border-red-300 p-2">
                    <div class="child-basic bg-red-600">1</div>
                    <div class="child-basic bg-red-600">2</div>
                    <div class="child-basic bg-red-600">3</div>
                    <div class="child-basic bg-red-600">4</div>
                </div>
            </div>

            <div class="p-4 border-4 border-green-400 bg-green-50 rounded-lg">
                <h4 class="text-xl font-bold mb-3 text-green-700">`flex-col` (Cột dọc)</h4>
                <div class="flex flex-col items-center h-96 border-dashed border-green-300 p-2">
                    <div class="child-basic bg-green-600">1</div>
                    <div class="child-basic bg-green-600">2</div>
                    <div class="child-basic bg-green-600">3</div>
                    <div class="child-basic bg-green-600">4</div>
                </div>
            </div>

            <div class="p-4 border-4 border-purple-400 bg-purple-50 rounded-lg">
                <h4 class="text-xl font-bold mb-3 text-purple-700">`flex-col-reverse` (Cột dọc đảo ngược)</h4>
                <div class="flex flex-col-reverse items-center h-96 border-dashed border-purple-300 p-2">
                    <div class="child-basic bg-purple-600">1</div>
                    <div class="child-basic bg-purple-600">2</div>
                    <div class="child-basic bg-purple-600">3</div>
                    <div class="child-basic bg-purple-600">4</div>
                </div>
            </div>
        </div>
    </div>

    
</body>
</html>
