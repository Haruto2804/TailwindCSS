<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minh Họa Box Shadow Tailwind</title>
  <link rel="stylesheet" href="src/output.css">
</head>

<body class="bg-gray-100 p-10">

  <h1 class="text-3xl font-extrabold text-indigo-700 text-center mb-12 border-b pb-2">
    Minh Họa Các Cấp Độ Box Shadow
  </h1>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-8 max-w-6xl mx-auto">

    <div class="h-28 w-full bg-white rounded-lg p-3 flex items-center justify-center shadow-2xs">
      <p class="text-sm font-medium">shadow-2xs</p>
    </div>

    <div class="h-28 w-full bg-white rounded-lg p-3 flex items-center justify-center shadow-xs">
      <p class="text-sm font-medium">shadow-xs</p>
    </div>

    <div class="h-28 w-full bg-white rounded-lg p-3 flex items-center justify-center shadow-sm">
      <p class="text-sm font-medium">shadow-sm</p>
    </div>

    <div class="h-28 w-full bg-white rounded-lg p-3 flex items-center justify-center shadow-md">
      <p class="text-sm font-medium">shadow-md</p>
    </div>

    <div class="h-28 w-full bg-white rounded-lg p-3 flex items-center justify-center shadow-lg">
      <p class="text-sm font-medium">shadow-lg</p>
    </div>

    <div class="h-28 w-full bg-white rounded-lg p-3 flex items-center justify-center shadow-xl">
      <p class="text-sm font-medium">shadow-xl</p>
    </div>

    <div class="h-28 w-full bg-white rounded-lg p-3 flex items-center justify-center shadow-2xl">
      <p class="text-sm font-medium">shadow-2xl</p>
    </div>

    <div
      class="h-28 w-full bg-white rounded-lg p-3 flex items-center justify-center shadow-none border border-gray-300">
      <p class="text-sm font-medium">shadow-none</p>
    </div>

  </div>

  <h2 class="text-2xl font-bold text-gray-700 mt-12 mb-6 border-b pb-1">Tùy Chỉnh (Custom Shadow)</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto">

    <div class="h-32 w-full bg-yellow-100 rounded-xl p-4 flex flex-col items-center justify-center 
                    shadow-[0_25px_50px_-12px_rgba(0,0,0,0.6)]">
      <p class="text-sm font-bold text-gray-800">shadow-[0_25px_50px_-12px_rgba(0,0,0,0.6)]</p>
      <p class="text-xs text-red-500 mt-1">Độ bóng lớn, tối màu hơn.</p>
    </div>

    <div class="h-32 w-full bg-green-100 rounded-xl p-4 flex flex-col items-center justify-center 
                    shadow-[inset_0_0_15px_rgba(0,0,0,0.5)]">
      <p class="text-sm font-bold text-gray-800">shadow-[inset_0_0_15px_rgba(0,0,0,0.5)]</p>
      <p class="text-xs text-red-500 mt-1">Đổ bóng bên trong (inset).</p>
    </div>
  </div>

</body>

</html>
