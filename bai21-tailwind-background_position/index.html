<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Background-Position Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-10">

  <h1 class="text-3xl text-gray-800 font-bold text-center mb-10">
    Tailwind CSS – Background Position Demo
  </h1>

  <div class="grid grid-cols-3 gap-8">

    <!-- Top-left -->
    <div>
      <p class="text-gray-700 font-medium mb-2 text-center">bg-top-left</p>
      <div class="w-full h-40 bg-[url(/image.png)] bg-top-left bg-no-repeat
                  border border-gray-300 rounded-lg shadow " ></div>
    </div>

    <!-- Top -->
    <div>
      <p class="text-gray-700 font-medium mb-2 text-center">bg-top</p>
      <div class="w-full h-40 bg-[url(/image.png)] bg-top bg-no-repeat
                  border border-gray-300 rounded-lg shadow"></div>
    </div>

    <!-- Top-right -->
    <div>
      <p class="text-gray-700 font-medium mb-2 text-center">bg-top-right</p>
      <div class="w-full h-40 bg-[url(/image.png)] bg-top-right bg-no-repeat
                  border border-gray-300 rounded-lg shadow "></div>
    </div>

    <!-- Left -->
    <div>
      <p class="text-gray-700 font-medium mb-2 text-center">bg-left</p>
      <div class="w-full h-40 bg-[url(/image.png)] bg-left bg-no-repeat
                  border border-gray-300 rounded-lg shadow"></div>
    </div>

    <!-- Center -->
    <div>
      <p class="text-gray-700 font-medium mb-2 text-center">bg-center</p>
      <div class="w-full h-40 bg-[url(/image.png)] bg-center bg-no-repeat
                  border border-gray-300 rounded-lg shadow"></div>
    </div>

    <!-- Right -->
    <div>
      <p class="text-gray-700 font-medium mb-2 text-center">bg-right</p>
      <div class="w-full h-40 bg-[url(/image.png)] bg-right bg-no-repeat
                  border border-gray-300 rounded-lg shadow"></div>
    </div>

    <!-- Bottom-left -->
    <div>
      <p class="text-gray-700 font-medium mb-2 text-center">bg-bottom-left</p>
      <div class="w-full h-40 bg-[url(/image.png)] bg-bottom-left bg-no-repeat
                  border border-gray-300 rounded-lg shadow"></div>
    </div>

    <!-- Bottom -->
    <div>
      <p class="text-gray-700 font-medium mb-2 text-center">bg-bottom</p>
      <div class="w-full h-40 bg-[url(/image.png)] bg-bottom bg-no-repeat
                  border border-gray-300 rounded-lg shadow"></div>
    </div>

    <!-- Bottom-right -->
    <div>
      <p class="text-gray-700 font-medium mb-2 text-center">bg-bottom-right</p>
      <div class="w-full h-40 bg-[url(/image.png)] bg-bottom-right bg-no-repeat
                  border border-gray-300 rounded-lg shadow"></div>
    </div>

  </div>

</body>

</html>
