<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flex Demo – Grow Shrink Basis</title>
  <link rel="stylesheet" href="src/output.css">

  <style>
    /* Animation: container co lại rồi giãn ra */
    @keyframes resizeBox {
      0% {
        width: 350px;
      }

      50% {
        width: 90%;
      }

      100% {
        width: 350px;
      }
    }

    .animate-resize {
      animation: resizeBox 6s infinite ease-in-out;
    }
  </style>
</head>

<body class="bg-gray-100 p-10">

  <h1 class="text-2xl font-bold mb-8">Flex Grow / Shrink / Basis Demo (Animated)</h1>

  <!-- ===================== GROW DEMO ====================== -->
  <div class="animate-resize bg-white shadow-md rounded-xl p-5 mb-10">
    <h2 class="font-semibold mb-3 text-lg">1. Flex Grow</h2>

    <div class="flex gap-4 p-4 bg-gray-200 rounded-lg">
      <div class="bg-blue-500 grow p-4 text-center text-white rounded-lg">
        grow-1
      </div>

      <div class="bg-green-500 grow p-4 text-center text-white rounded-lg">
        grow-1
      </div>

      <div class="bg-red-500 p-4 text-center text-white rounded-lg">
        grow-0
      </div>
    </div>
  </div>

  <!-- ===================== SHRINK DEMO ====================== -->
  <div class="animate-resize bg-white shadow-md rounded-xl p-5 mb-10">
    <h2 class="font-semibold mb-3 text-lg">2. Flex Shrink</h2>
    <div class="flex gap-4 p-4 bg-gray-200 rounded-lg overflow-auto">
      <div class="bg-blue-600 w-64 shrink-0 p-4 text-center text-white rounded-lg">
        shrink-0
      </div>

      <div class="bg-green-600 w-64 shrink p-4 text-center text-white rounded-lg">
        shrink-1
      </div>
      <div class="bg-green-600 w-64 shrink-0 p-4 text-center text-white rounded-lg w-1]">
        shrink-0
      </div>
      <div class="bg-green-600 w-64 shrink p-4 text-center text-white rounded-lg">
        shrink-1
      </div>
    </div>
  </div>

  <!-- ===================== BASIS DEMO ====================== -->
  <div class="animate-resize bg-white shadow-md rounded-xl p-5">
    <h2 class="font-semibold mb-3 text-lg">3. Flex Basis</h2>

    <div class="flex gap-4 p-4 bg-gray-200 rounded-lg">
      <div class="bg-blue-400 basis-1/4 p-4 text-center text-white rounded-lg">
        25%
      </div>

      <div class="bg-green-400 basis-1/2 p-4 text-center text-white rounded-lg">
        50%
      </div>

      <div class="bg-red-400 basis-1/4 p-4 text-center text-white rounded-lg">
        25%
      </div>
    </div>
  </div>

</body>

</html>
